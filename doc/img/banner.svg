<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <title>Arno Chat: chat and a coding workspace for your phone</title>
  <defs>
    <linearGradient id="bg-arno-chat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg-arno-chat)" rx="12"/>

  <!-- the logo: the otter -->
  <g transform="translate(56, 36)">
    <rect width="128" height="128" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- the otter: ears, head, cream muzzle, eyes, nose, smile, whiskers, teal bandana -->
    <circle cx="28" cy="40" r="8" fill="#7c3f24"/>
    <circle cx="100" cy="40" r="8" fill="#7c3f24"/>
    <circle cx="28" cy="40" r="3.5" fill="#4a2414"/>
    <circle cx="100" cy="40" r="3.5" fill="#4a2414"/>
    <ellipse cx="64" cy="60" rx="44" ry="33" fill="#b5532d"/>
    <ellipse cx="64" cy="76" rx="28" ry="20" fill="#f6dcb4"/>
    <circle cx="48" cy="54" r="5" fill="#0f172a"/>
    <circle cx="80" cy="54" r="5" fill="#0f172a"/>
    <circle cx="49.6" cy="52.2" r="1.6" fill="#fff"/>
    <circle cx="81.6" cy="52.2" r="1.6" fill="#fff"/>
    <path d="M56 66 h16 q0 9 -8 9 q-8 0 -8 -9 z" fill="#4a2414"/>
    <path d="M52 82 q12 9 24 0" fill="none" stroke="#4a2414" stroke-width="2.5" stroke-linecap="round"/>
    <g stroke="#fdf3e0" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M44 74 l-22 -4 M44 79 l-22 3 M84 74 l22 -4 M84 79 l22 3"/>
    </g>
    <path d="M30 100 q34 18 68 0 l-6 14 q-28 12 -56 0 z" fill="#14b8a6"/>
    <circle cx="64" cy="106" r="5" fill="#0f766e"/>
  </g>

  <text x="220" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="1">arno chat</text>
  <text x="222" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif"
        font-size="18" fill="#94a3b8">chat, research and a coding workspace, from your phone</text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="222" y="150" width="112" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="278" y="166" fill="#2dd4bf">Cloudflare</text>
    <rect x="344" y="150" width="128" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="408" y="166" fill="#2dd4bf">eight providers</text>
    <rect x="482" y="150" width="120" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="542" y="166" fill="#2dd4bf">works offline</text>
  </g>
</svg>
